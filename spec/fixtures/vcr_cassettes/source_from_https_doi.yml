        Press","issue":"4","content-domain":{"domain":[],"crossmark-restriction":false},"abstract":"<jats:p>Some
        species of the subgenus Tachycines (Gymnaeta) inhabit caves. In this study,
        a new species of, Gymnaeta namely Tachycines (Gymnaeta) lalinus sp. nov.,
        from two karst caves in Guizhou Province, China is described. This new species
        resembles the cave species Tachycines (Gymnaeta) zorzini from Guizhou Province,
        but can be separated from the latter by morphological characters of the male
