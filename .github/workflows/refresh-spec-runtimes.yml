name: refresh spec runtimes

# Monthly: rewrite .github/spec_runtimes.log from recent development builds'
# spec-runtimes artifacts and open a pull request if it changed. The log
# balances the build workers (see .github/spec_runner.sh); a stale log only
# makes the split a little less even, so a missed month does no harm.
#
# Needs "Allow GitHub Actions to create and approve pull requests" in the
# repository's Actions settings. Pull requests opened with GITHUB_TOKEN don't
# start the build workflow; the file is only read when splitting specs, so
# merging without a build is safe, or close and reopen the pull request to
# run one.

on:
  schedule:
    - cron: '0 6 1 * *'
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  pull-requests: write

jobs:
  refresh:
    if: github.repository == 'SpeciesFileGroup/taxonworks'
    runs-on: ubuntu-24.04

    steps:
    - name: Git checkout
      uses: actions/checkout@v6
      with:
        ref: development

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1

    - name: Rewrite spec runtimes
      env:
        GH_TOKEN: ${{ github.token }}
      run: ruby .github/refresh_spec_runtimes.rb

    - name: Open pull request
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        if git diff --quiet -- .github/spec_runtimes.log; then
          echo 'Spec runtimes unchanged'
          exit 0
        fi

        branch="refresh_spec_runtimes_$(date -u +%Y%m%d)"
        git config user.name 'github-actions[bot]'
        git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
        git switch -c "$branch"
        git add .github/spec_runtimes.log
        git commit -m 'Refresh spec runtimes'
        git push origin "$branch"

        gh pr create --base development --head "$branch" \
          --title 'Refresh spec runtimes' \
          --body 'Monthly update of `.github/spec_runtimes.log` from the latest development builds, used to balance the build workers (see `.github/spec_runner.sh`). Generated by the refresh-spec-runtimes workflow.'
